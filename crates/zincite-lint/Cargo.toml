[package]
name = "zincite-lint"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MiniZinc source lint advice"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zincite-lint/0.4.0"
readme = "README.md"
include = ["/src/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
zincite-syntax = { version = "0.4.0", path = "../zincite-syntax" }
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde", "std", "display"] }
annotate-snippets = "0.12"
