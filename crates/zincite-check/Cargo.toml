[package]
name = "zincite-check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Repeated candidate checking for a documented FlatZinc subset"
readme = "README.md"
include = ["/src/**", "/examples/**", "/minizinc/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
default = ["prepare"]
prepare = ["dep:zincite-syntax"]

[dependencies]
zincite-syntax = { version = "0.3.0", path = "../zincite-syntax", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "zincite-check"
path = "src/main.rs"
required-features = ["prepare"]

[[example]]
name = "schedule-feedback"
required-features = ["prepare"]
