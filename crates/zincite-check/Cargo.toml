[package]
name = "zincite-check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Repeated native and WebAssembly candidate checking for FlatZinc"
readme = "README.md"
include = ["/src/**", "/examples/**", "/minizinc/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
default = ["prepare"]
prepare = ["dep:zincite-syntax"]
wasm = ["dep:wasm-bindgen"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
libm = { version = "=0.2.16", default-features = false }
zincite-syntax = { version = "0.3.0", path = "../zincite-syntax", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }

[[bin]]
name = "zincite-check"
path = "src/main.rs"
required-features = ["prepare"]

[[example]]
name = "schedule-feedback"
required-features = ["prepare"]

[[example]]
name = "measure-checking"
required-features = ["prepare"]
