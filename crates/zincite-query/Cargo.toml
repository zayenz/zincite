[package]
name = "zincite-query"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Source-preserving MiniZinc inspection and data queries"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zincite-query/0.1.0"
readme = "README.md"
include = ["/src/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/tests/fixtures/**"]

[dependencies]
zirql = { version = "0.1.0", git = "https://github.com/zayenz/zirql", rev = "860247d1cc703d058979d39344c72d7e669092ce" }
zincite-lint = { version = "0.1.0", path = "../zincite-lint" }
zincite-syntax = { version = "0.1.0", path = "../zincite-syntax" }
serde_json = { version = "1", features = ["preserve_order"] }
