[package]
name = "zincite-query"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Source-preserving MiniZinc inspection and data queries"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zincite-query/0.2.0"
readme = "README.md"
include = ["/src/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/tests/fixtures/**", "/examples/**"]

[dependencies]
zirql = { git = "https://github.com/zayenz/zirql", rev = "bfc799d488365f28b498ff8244f0497461348411" }
zincite-lint = { version = "0.2.0", path = "../zincite-lint" }
zincite-syntax = { version = "0.2.0", path = "../zincite-syntax" }
serde_json = { version = "1", features = ["preserve_order"] }

[[example]]
name = "grow-wedding"
path = "examples/grow-wedding.rs"
test = true
