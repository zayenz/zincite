[workspace]
members = [".", "crates/zincite-syntax", "crates/zincite-fmt", "crates/zincite-lint", "crates/zincite-query"]
default-members = [".", "crates/zincite-syntax", "crates/zincite-fmt", "crates/zincite-lint", "crates/zincite-query"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[package]
name = "zincite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MiniZinc source formatting and linting tools"

[dependencies]
zincite-fmt = { path = "crates/zincite-fmt" }
zincite-lint = { path = "crates/zincite-lint" }
zincite-query = { path = "crates/zincite-query" }
